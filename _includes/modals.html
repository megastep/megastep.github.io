{% assign featured_posts = site.posts | sort: "featured-order" %}
{% for post in featured_posts %}
<dialog class="project-dialog" id="modal-{{ post.modal-id }}" aria-labelledby="modal-{{ post.modal-id }}-title">
  <div class="project-dialog__surface">
    <button class="project-dialog__close" type="button" data-dialog-close>Close</button>
    <div class="project-dialog__header">
      <h2 id="modal-{{ post.modal-id }}-title">{{ post.title }}</h2>
      <p class="project-dialog__description">{{ post.description }}</p>
    </div>
    <div class="project-dialog__body article-content">{{ post.content }}</div>
  </div>
</dialog>
{% endfor %}
