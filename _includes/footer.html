<footer class="site-footer">
  <div class="site-footer__inner">
    <p>Copyright &copy; {{ site.footer.copyright }} {{ site.time | date: '%Y' }}.</p>
    <ul class="social-links" aria-label="Featured social profiles">
      {% for network in site.social %}
        {% if network.featured %}
        <li>
          <a rel="me" href="{{ network.url }}" aria-label="{{ network.title | replace: '-', ' ' | capitalize }}">
            <span class="social-icon social-icon--{{ network.title }}" aria-hidden="true"></span>
          </a>
        </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</footer>
