# Site settings
title: Stéphane Peter
email: info@stephanepeter.com
url: https://stephanepeter.com
description: "Stéphane Peter: Software Engineer, Musician, Entrepreneur."
locale: en_US
# To enable the Twitter Card features
twitter: 
  username: megastep
  card: summary_large_image
facebook:
  publisher: https://www.facebook.com/megastep
author:
  twitter: megastep
  picture: /img/profile.png
logo: /img/profile.png
image: /img/banner.jpg
imgprefix: ""

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 18bc9c #80B3FF
  secondary: 2c3e50 #FD6E8A
  secondary-dark: 233140 #A2122F

exclude:
  - screenshot.png
  - README.md
  - AGENTS.md
  - LICENCE
  - CNAME
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - scripts
  - files/StephanePeter-web.pdf

# Footer settings
footer:
  copyright: Stéphane Peter

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: x-twitter
    url: https://x.com/megastep
  - title: facebook
    url: https://facebook.com/megastep
  - title: bluesky
    url: https://bsky.app/profile/stephanepeter.com
    featured: true
  - title: linkedin
    url: https://www.linkedin.com/in/stephanepeter
    featured: true
  - title: mastodon
    url: https://me.dm/@megastep
    featured: true
  - title: github
    url: https://github.com/megastep
    featured: true
  - title: stack-overflow
    url: https://stackoverflow.com/users/115287/megastep
  - title: youtube
    url: https://www.youtube.com/user/megastep
    featured: true
  - title: vimeo-square
    url: https://vimeo.com/megastep
  - title: soundcloud
    url: https://soundcloud.com/stephanepeter
  - title: lastfm
    url: https://www.last.fm/user/megascargot
  - title: instagram
    url: https://instagram.com/megastep/
    featured: true
  - title: tumblr
    url: https://megastep.tumblr.com/
  - title: medium
    url: https://angryfrenchman.org/

googletag: GTM-NTV73Q3

# Build settings
markdown: kramdown
permalink: /section/:title/
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-minifier

jekyll-minifier:
  compress_css: true
  compress_javascript: true
  exclude:
    - feed.xml
